name: Build tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, build, and release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist package

          build_archive() {
            os="$1"
            arch="$2"
            name="go-webssh_${VERSION}_${os}_${arch}"
            dir="package/${name}"

            mkdir -p "${dir}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${dir}/go-webssh" ./cmd/webssh
            cp README.md config.example.yaml "${dir}/"
            mkdir -p "${dir}/themes"
            cp themes/*.json themes/README.md "${dir}/themes/"
            tar -C package -czf "dist/${name}.tar.gz" "${name}"
          }

          build_archive linux amd64
          build_archive linux arm64

          cp install.sh dist/install.sh

          (cd dist && sha256sum ./* > SHA256SUMS)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-webssh-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              --title "Go WebSSH ${GITHUB_REF_NAME}"
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
